# Nginx configuration for Lunar Quanta static blog
#
# This configuration serves the static HTML files generated by StaticGenerator.
# The blog is served at /blog/ with static HTML files.
#
# Usage:
# 1. Copy this file to /etc/nginx/sites-available/lunar-blog
# 2. Create a symlink: ln -s /etc/nginx/sites-available/lunar-blog /etc/nginx/sites-enabled/
# 3. Adjust the root path to match your installation
# 4. Test config: nginx -t
# 5. Reload nginx: systemctl reload nginx

server {
    listen 80;
    server_name example.com www.example.com;

    # Adjust this to your project root
    root /var/www/lunar-quanta/public;
    index index.php index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/html;
    gzip_min_length 256;

    # Static blog - served directly without PHP
    location /blog/ {
        # Try static HTML files first
        try_files $uri $uri/ =404;

        # Cache static content
        expires 1h;
        add_header Cache-Control "public, immutable";
    }

    # RSS feed
    location = /blog/feed.xml {
        types { application/rss+xml xml; }
        expires 1h;
    }

    # Sitemap
    location = /sitemap.xml {
        types { application/xml xml; }
        expires 1d;
    }

    # Admin interface - requires PHP
    location /admin {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Main application - PHP fallback
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP processing
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # Timeouts
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 60s;
        fastcgi_read_timeout 60s;
    }

    # Deny access to sensitive files
    location ~ /\.(env|git|htaccess) {
        deny all;
    }

    # Deny access to data directory
    location ~ ^/data/ {
        deny all;
    }

    # Error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
}

